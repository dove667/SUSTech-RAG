project:
  name: sustech-campus-rag
  data_dir: data

crawl:
  user_agent: "Mozilla/5.0 (compatible; SUSTechCampusRAG/0.1; +https://www.sustech.edu.cn/)"
  seed_urls:
    - "https://www.sustech.edu.cn/"
  allowed_domains:
    - "sustech.edu.cn"
  max_pages: 200
  timeout_seconds: 20
  include_pdf_links: false

processing:
  min_text_length: 60
  max_repeated_line_ratio: 0.35
  drop_patterns:
    - "版权所有"
    - "Copyright"
    - "All Rights Reserved"
    - "ICP备"
  chunk_size: 500
  chunk_overlap: 100

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  local_path: "data/models/embeddings/BAAI/bge-small-zh-v1.5"
  batch_size: 16

retrieval:
  mode: "self_rag"
  similarity_top_k: 8
  sparse_top_k: 8
  sparse_enabled: true
  rerank_top_n: 4
  max_rounds: 2
  reranker_model: "BAAI/bge-reranker-v2-m3"
  reranker_local_path: "data/models/rerankers/BAAI/bge-reranker-v2-m3"

vector_store:
  persist_dir: "data/vector_store/chroma"
  collection_name: "sustech-campus-kb"

llm:
  backend: "llama_cpp"
  model_path: "data/models/llm/qwen/Qwen3-8B-Q4_K_M.gguf"
  device_mode: "auto"
  device_name: ""
  gpu_layers: 32 # 加载模型时放在 GPU 上的层数；None = 不传 -ngl
  threads: null # None = 不传 -t，用 llama-server 默认 (-1=auto)
  threads_batch: 2 # 批处理线程数；None = 不传 -tb
  reasoning: "off"
  n_ctx: 8192
  temperature: 0.2
  max_tokens: 512
  max_concurrent_requests: 1 # llama.cpp 阶段默认串行，后续可为 vLLM 放宽
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"
  server_port: 8081
  # ----- sampling params -----
  top_p: 0.95
  top_k: 0
  repeat_penalty: 1.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  # ----- server / memory params -----
  flash_attn: "auto" # on / off / auto；"auto" 让 llama-server 自动判断
  ubatch_size: 512
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  kv_offload: true # true = 将 KV cache 卸载到 GPU；false = 留在 CPU
  n_batch: 512
  # ----- structured output -----
  structured_output_mode: "json_schema" # json_schema / gbnf_grammar / prompt_only
  extra_args: []
