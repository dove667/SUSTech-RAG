[project]
name = "sustech-campus-rag"
version = "0.1.0"
description = "Campus Knowledge Base RAG for SUSTech with end-to-end data pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4==4.12.3",
  "chromadb==1.5.9",
  "click>=8.1,<8.2",
  "fastapi==0.121.0",
  "httpx==0.28.1",
  "llama-index>=0.14,<0.15",
  "llama-index-embeddings-huggingface>=0.6,<0.7",
  "llama-index-vector-stores-chroma>=0.5.5,<0.6",
  "lxml-html-clean==0.4.4",
  "markdownify==1.1.0",
  "pydantic==2.12.0",
  "pydantic-settings==2.11.0",
  "pypdf==5.3.0",
  "posthog>=6,<7",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "readability-lxml==0.8.4.1",
  "sentence-transformers==5.4.1",
  "tenacity==9.0.0",
  "transformers==4.57.1",
  "typer==0.15.1",
  "uvicorn[standard]==0.34.0",
  "vllm==0.21.0; sys_platform == 'linux'",
  "jieba>=0.42.1",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[project.scripts]
sustech-rag = "sustech_rag.cli.main:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sustech_rag"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Call to deprecated method get_doc_id.*:DeprecationWarning:llama_index\\.core\\.indices\\.base",
]
