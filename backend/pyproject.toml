[project]
name = "sustech-campus-rag"
version = "0.1.0"
description = "Campus Knowledge Base RAG for SUSTech with end-to-end data pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4==4.12.3",
  "chromadb==0.5.23",
  "httpx==0.28.1",
  "llama-index==0.12.21",
  "llama-index-embeddings-huggingface==0.5.1",
  "llama-index-vector-stores-chroma==0.4.1",
  "lxml-html-clean==0.4.4",
  "markdownify==1.1.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "pypdf==5.3.0",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "readability-lxml==0.8.4.1",
  "sentence-transformers==3.4.1",
  "tenacity==9.0.0",
  "typer==0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[project.scripts]
sustech-rag = "sustech_rag.cli.main:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sustech_rag"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
