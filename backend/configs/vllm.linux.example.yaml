project:
  name: sustech-campus-rag
  data_dir: data

crawl:
  user_agent: "Mozilla/5.0 (compatible; SUSTechCampusRAG/0.1; +https://www.sustech.edu.cn/)"
  seed_urls:
    - "https://www.sustech.edu.cn/"
  allowed_domains:
    - "sustech.edu.cn"
  max_pages: 200
  timeout_seconds: 20
  include_pdf_links: false

processing:
  min_text_length: 60
  max_repeated_line_ratio: 0.35
  drop_patterns:
    - "版权所有"
    - "Copyright"
    - "All Rights Reserved"
    - "ICP备"
  chunk_size: 500
  chunk_overlap: 100

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  local_path: "data/models/embeddings/BAAI/bge-small-zh-v1.5"
  batch_size: 16

retrieval:
  similarity_top_k: 8
  sparse_top_k: 8
  sparse_enabled: true
  rerank_top_n: 4
  reranker_model: "BAAI/bge-reranker-v2-m3"
  reranker_local_path: "data/models/rerankers/BAAI/bge-reranker-v2-m3"

vector_store:
  persist_dir: "data/vector_store/chroma"
  collection_name: "sustech-campus-kb"

llm:
  backend: "vllm"
  temperature: 0.2
  max_tokens: 1024
  max_concurrent_requests: 32
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"
  server_port: 8081
  model_name: "Qwen/Qwen3.6-35B-A3B-FP8"
  local_path: ""
  binary_path: "~/miniconda3/envs/vllm-0.21/bin/vllm"
  served_model_name: "qwen3.6-35b-a3b-fp8"
  dtype: "auto"
  gpu_memory_utilization: 0.92
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  data_parallel_size: 1
  distributed_executor_backend: "mp"
  max_model_len: 32768
  max_num_seqs: 32
  max_num_batched_tokens: 12288
  reasoning_parser: "qwen3"
  api_key: ""
  generation_config: "vllm"
  trust_remote_code: false
  enable_prefix_caching: true
  enable_log_requests: false
  disable_uvicorn_access_log: true
  max_parallel_loading_workers: 4
  extra_args: []
