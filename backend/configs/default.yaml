project:
  name: sustech-campus-rag
  data_dir: data

crawl:
  user_agent: "Mozilla/5.0 (compatible; SUSTechCampusRAG/0.1; +https://www.sustech.edu.cn/)"
  seed_urls:
    - "https://www.sustech.edu.cn/"
  allowed_domains:
    - "sustech.edu.cn"
  max_pages: 200
  timeout_seconds: 20
  include_pdf_links: false

processing:
  min_text_length: 60
  max_repeated_line_ratio: 0.35
  drop_patterns:
    - "版权所有"
    - "Copyright"
    - "All Rights Reserved"
    - "ICP备"
  chunk_size: 500
  chunk_overlap: 100

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  local_path: "data/models/embeddings/BAAI/bge-small-zh-v1.5"
  batch_size: 16

retrieval:
  similarity_top_k: 8
  sparse_top_k: 8
  sparse_enabled: true
  rerank_top_n: 4
  reranker_model: "BAAI/bge-reranker-v2-m3"
  reranker_local_path: "data/models/rerankers/BAAI/bge-reranker-v2-m3"

vector_store:
  persist_dir: "data/vector_store/chroma"
  collection_name: "sustech-campus-kb"

llm:
  model_path: "data/models/llm/qwen/Qwen3-8B-Q4_K_M.gguf"
  device_mode: "auto"
  device_name: ""
  gpu_layers: "32" # 加载模型时放在 GPU 上的层数，Qwen3-8B 有 32 层
  threads: 0 # 自动（通常 CPU 核心数）
  threads_batch: 2 # 批处理线程数
  reasoning: "off"
  n_ctx: 8192
  temperature: 0.2
  max_tokens: 512
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"
  server_port: 8081
  extra_args: []
